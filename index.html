<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F2EA">
<title>Mise</title>
<style>
  :root{--bg:#F7F2EA;--card:#FFFDF9;--ink:#2A1A0E;--ink2:#5C4632;--muted:#8E7A66;--line:#E9DDCC;--brand:#7A4422;--brand2:#B9773C;--gold:#C9923E;--ok:#2F7D57;--bad:#B4452F;--warn:#B7791F;
    --prep:#E4F1E6;--oven:#FBE6CF;--stove:#F3E5F2;--fin:#E4ECFA;--shadow:0 10px 28px rgba(60,34,16,.08)}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  button,input,select{font:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
  header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:38px;height:38px;border-radius:13px;background:conic-gradient(from 200deg,var(--gold),var(--brand),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
  .brand b{display:block;font-size:17px}
  .brand small{color:var(--muted);font-size:11.5px}
  .ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:13px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:8px 14px;border-radius:99px;cursor:pointer;font-size:13px}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  h2{font-size:15px;margin:18px 2px 10px;display:flex;justify-content:space-between;align-items:center}
  h2 span{font-size:11.5px;color:var(--muted);font-weight:600}
  .muted{color:var(--muted);font-size:12.5px;line-height:1.8}
  .hero{border-radius:24px;padding:20px;color:#FFF7EC;background:linear-gradient(140deg,#8A4E24,#3B2010 75%);box-shadow:var(--shadow)}
  .hero .lbl{font-size:11.5px;opacity:.8}
  .hero h3{margin:6px 0 6px;font-size:20px}
  .hero p{margin:0;font-size:12.5px;opacity:.9;line-height:1.8}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi .k{font-size:11.5px;color:var(--muted)}
  .kpi .v{font-size:21px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpis2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .good{color:var(--ok)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row b{font-size:13.5px;display:block}
  .row small{color:var(--muted);font-size:11.5px;display:block}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
  .line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .line:last-child{border-bottom:0}
  .amt{text-align:left;font-weight:800;font-variant-numeric:tabular-nums}
  .amt small{display:block;font-weight:600;color:var(--muted);font-size:11px}
  .pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px}
  .pill.ok{background:rgba(47,125,87,.14);color:var(--ok)}
  .pill.bad{background:rgba(180,69,47,.14);color:var(--bad)}
  .pill.warn{background:rgba(183,121,31,.16);color:var(--warn)}
  .inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:0}
  .inp:focus{border-color:var(--brand2)}
  .mini{width:90px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:center}
  label.f{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px;font-weight:700}
  .search{width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:0;margin-bottom:10px}
  .btn{width:100%;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--brand),#4E2A14);color:#FFF8EE;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
  .back{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:6px 0}
  .rrow{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:10px}
  .rrow b{display:block;font-size:15px}
  .rrow small{color:var(--muted);font-size:12px}
  .price{margin-inline-start:auto;text-align:left;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
  .price small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
  .thumb{width:50px;height:50px;border-radius:16px;flex:0 0 50px;background:radial-gradient(circle at 35% 30%,#FFE6BF,#C27A3E 60%,#4A2716)}
  .stage{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:var(--card)}
  .stage.prep .stage-h{background:var(--prep)} .stage.oven .stage-h{background:var(--oven)} .stage.stove .stage-h{background:var(--stove)} .stage.fin .stage-h{background:var(--fin)}
  .stage-h{padding:11px 14px;font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
  .stage-h .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.6);color:var(--ink2)}
  .stage.closed .sb{display:none}
  .sb{padding:4px 14px 10px}
  .comp{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .comp:last-child{border-bottom:0}
  .comp .q{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .sub{font-style:normal;font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--brand);color:#fff;margin-inline-start:6px}
  .note{margin:8px 0 4px;padding:9px 12px;border-radius:12px;background:rgba(201,146,62,.14);color:var(--ink2);font-size:12.5px;line-height:1.7}
  .costbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:10px 0 8px;background:var(--line)}
  .costbar i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2)}
  .stock-row{padding:12px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .stock-row:last-child{border-bottom:0}
  .stock-row .r1{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700}
  .stock-row .r1 small{color:var(--muted);font-weight:600}
  .stock-row .r2{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--brand2));border-radius:99px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
  .stepper b{min-width:50px;text-align:center;font-size:20px}
  .alert{margin-top:12px;padding:12px;border-radius:14px;font-size:13px;line-height:1.7}
  .alert.bad{background:rgba(180,69,47,.1);color:var(--bad)}
  .who{display:flex;align-items:center;gap:10px}
  .av{width:40px;height:40px;border-radius:50%;background:var(--brand2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .login{max-width:380px;margin:50px auto 0}
  .msg{min-height:18px;margin-top:10px;text-align:center;font-size:13px;color:var(--bad)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin:24px 0 0}
  @media print{header,.tabs,.btn,.ib,.toast{display:none}.wrap{max-width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
